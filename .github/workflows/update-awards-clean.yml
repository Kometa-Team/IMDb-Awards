name: Update-IMDb-Awards-Clean

on:
  schedule:
    - cron: '0 17 1 * *'
  workflow_dispatch:

jobs:
  Update-IMDb-Awards-Clean:
    runs-on: ubuntu-latest
    steps:

      - name: Get current date
        id: date
        run: echo "date=$(date +'%B %d, %Y %I:%M %p')" >> $GITHUB_OUTPUT

      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip & Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-v1
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Ensure Playwright package is present even if not in requirements.txt
          python -m pip install playwright

      - name: Install Playwright browsers + system dependencies
        run: |
          # Use --with-deps on Ubuntu to fetch needed system libraries where supported
          python -m playwright install --with-deps

      - name: Validate Playwright (smoke test)
        run: |
          python - <<'PY'
          import sys
          try:
              from playwright.sync_api import sync_playwright
              with sync_playwright() as pw:
                  print("Playwright available, browsers ready")
          except Exception as e:
              print("Playwright validation failed:", e)
              sys.exit(2)
          PY

      - name: Run Update IMDb Awards
        run: python imdb_awards.py --clean --no-sleep --trace

      - name: Check Diff
        id: verify_diff
        run: |
          git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & Push Changes
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Update at ${{ steps.date.outputs.date }} UTC" -a
          git push origin master

      - name: Discord Failure Notification
        uses: Kometa-Team/discord-notifications@master
        if: failure()
        with:
          webhook_id_token: ${{ secrets.BUILD_WEBHOOK }}
          message: ${{ vars.BUILD_FAILURE_ROLE }}
          title: "${{ vars.NAME }}: ${{ vars.TEXT_COPYRIGHT }}"
          url: https://github.com/Kometa-Team/${{ vars.NAME }}/actions/runs/${{ github.run_id }}
          color: ${{ vars.COLOR_FAILURE }}
          username: ${{ vars.BOT_NAME }}
          avatar_url: ${{ vars.BOT_IMAGE }}
          author: ${{ vars.GIT_NAME }}
          author_icon_url: ${{ vars.GIT_IMAGE }}