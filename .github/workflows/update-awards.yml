name: Update IMDb Awards

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  update-awards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip and Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browsers + system dependencies
        run: |
          # --with-deps downloads additional system packages on Linux if supported
          python -m playwright install --with-deps

      - name: Run imdb_awards.py
        run: |
          python imdb_awards.py --trace