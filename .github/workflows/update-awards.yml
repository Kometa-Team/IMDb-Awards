name: Update IMDb Awards

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  update-awards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-v2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run imdb_awards.py
        run: |
          python imdb_awards.py --trace

      - name: Commit & Push Changes
        run: |
          git add -- README.md event_ids.yml event_validation.yml events/
          if git diff --cached --quiet; then
            echo "No award updates to commit."
            exit 0
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Update at $(date -u +'%B %d, %Y %H:%M') UTC"
          git push origin HEAD:"$GITHUB_REF_NAME"
